<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="violetHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="cyanHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8" />
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .header-main { font-size: 26px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.5px; }
    .header-sub { font-size: 15px; fill: #94A3B8; font-weight: 500; }
    .card-title { font-size: 18px; font-weight: 700; fill: #FFFFFF; }
    .card-badge { font-size: 13px; font-weight: 800; letter-spacing: 1px; }
    .card-body { font-size: 14px; fill: #CBD5E1; font-weight: 400; line-height: 1.5; }
    .card-highlight { font-size: 14px; font-weight: 700; fill: #38BDF8; }
    .formula { font-family: "SF Mono", "Cascadia Code", "Fira Code", monospace; font-size: 16px; font-weight: 700; fill: #FBBF24; }
  </style>

  <!-- Background Canvas -->
  <rect width="1000" height="640" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- HEADER -->
  <text x="50" y="52" class="header-main">Segment-Aware <tspan fill="#38BDF8">Hybrid RAG Architecture</tspan></text>
  <text x="50" y="80" class="header-sub">Dual-stream dense vector + BM25 lexical retrieval unified with Reciprocal Rank Fusion (RRF)</text>

  <!-- STEP 1 & 2: Top Row -->
  <!-- Step 1: Input -->
  <g transform="translate(50, 110)">
    <rect width="425" height="90" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.8" />
    <text x="24" y="32" class="card-badge" fill="#A78BFA">STAGE 01</text>
    <text x="24" y="56" class="card-title">Raw Video &amp; Whisper ASR</text>
    <text x="24" y="78" class="card-body">Extracts speech, segments, and word-level timestamps</text>
  </g>

  <!-- Step 2: Overlapping Chunking -->
  <g transform="translate(525, 110)">
    <rect width="425" height="90" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.8" />
    <text x="24" y="32" class="card-badge" fill="#38BDF8">STAGE 02</text>
    <text x="24" y="56" class="card-title">Segment-Aware Chunking</text>
    <text x="24" y="78" class="card-body">120–180 words with 15–20% overlap • Preserves start/end times</text>
  </g>
  <path d="M 475 155 L 515 155" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Flow line to Dual Streams -->
  <path d="M 737 200 L 737 225 L 262 225 L 262 240" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 737 200 L 737 240" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4 4" />

  <!-- DUAL PARALLEL STREAMS: Middle Row -->
  <!-- Stream A: Dense Vector Retrieval -->
  <g transform="translate(50, 245)">
    <rect width="425" height="135" rx="12" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-width="2" />
    <path d="M 0 12 Q 0 0 12 0 L 413 0 Q 425 0 425 12 L 425 36 L 0 36 Z" fill="url(#violetHeader)" opacity="0.35" />
    <text x="24" y="24" class="card-badge" fill="#DDD6FE">STREAM A: DENSE VECTOR RETRIEVAL</text>
    <text x="24" y="64" class="card-title">ChromaDB Vector Store (768-Dim)</text>
    <text x="24" y="90" class="card-body">• Embedded via <tspan class="card-highlight">`nomic-embed-text`</tspan> (768 dimensions)</text>
    <text x="24" y="112" class="card-body">• Cosine distance • Project collections: <tspan class="card-highlight">`cf_project_{id}`</tspan></text>
  </g>

  <!-- Stream B: Lexical BM25 -->
  <g transform="translate(525, 245)">
    <rect width="425" height="135" rx="12" fill="url(#cardGrad)" stroke="#06B6D4" stroke-width="2" />
    <path d="M 0 12 Q 0 0 12 0 L 413 0 Q 425 0 425 12 L 425 36 L 0 36 Z" fill="url(#cyanHeader)" opacity="0.35" />
    <text x="24" y="24" class="card-badge" fill="#A5F3FC">STREAM B: LEXICAL FULL-TEXT RETRIEVAL</text>
    <text x="24" y="64" class="card-title">SQLite BM25 Inverted Index</text>
    <text x="24" y="90" class="card-body">• Captures exact keywords, proper nouns, numbers &amp; acronyms</text>
    <text x="24" y="112" class="card-body">• Full-text tokenization over SQLite <tspan class="card-highlight">`video_chunks`</tspan> table</text>
  </g>

  <!-- Connecting to RRF -->
  <path d="M 262 380 L 262 405 L 485 405" stroke="#38BDF8" stroke-width="2" />
  <path d="M 737 380 L 737 405 L 515 405" stroke="#38BDF8" stroke-width="2" />

  <!-- STEP 3 & 4: Fusion & Context Expansion -->
  <!-- RRF Box -->
  <g transform="translate(50, 420)">
    <rect width="425" height="100" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.8" />
    <text x="24" y="30" class="card-badge" fill="#FBBF24">STAGE 03: RANK FUSION</text>
    <text x="24" y="58" class="formula">RRF(d) = Σ [ 1 / (60 + rank_m(d)) ]</text>
    <text x="24" y="84" class="card-body">Unifies dense &amp; sparse ranks without scale distortion (k = 60)</text>
  </g>

  <!-- Context Expansion Box -->
  <g transform="translate(525, 420)">
    <rect width="425" height="100" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.8" />
    <text x="24" y="30" class="card-badge" fill="#34D399">STAGE 04: NARRATIVE CONTEXT</text>
    <text x="24" y="56" class="card-title">Chronological Window Expansion</text>
    <text x="24" y="82" class="card-body">Retrieves adjacent (±1) chunk window across video timeline</text>
  </g>
  <path d="M 475 470 L 515 470" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Final Synthesis Banner -->
  <g transform="translate(50, 545)">
    <rect width="900" height="65" rx="12" fill="#131B2E" stroke="#38BDF8" stroke-width="2" />
    <text x="28" y="28" class="card-title" fill="#38BDF8">STAGE 05: Grounded Answer Synthesis &amp; Interactive Jump Links</text>
    <text x="28" y="50" class="card-body">LLM outputs structured answer with <tspan class="card-highlight">[MM:SS]</tspan> citations that directly seek the video player to that exact second.</text>
  </g>
  <path d="M 737 520 L 737 540" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)" />
</svg>
