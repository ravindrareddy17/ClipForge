<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="dfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="dfCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
    <marker id="dfArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8" />
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .header-main { font-size: 26px; font-weight: 800; fill: #FFFFFF; }
    .header-sub { font-size: 15px; fill: #94A3B8; font-weight: 500; }
    .step-pill { font-size: 13px; font-weight: 800; letter-spacing: 1px; fill: #38BDF8; }
    .card-title { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
    .card-desc { font-size: 13.5px; fill: #CBD5E1; }
  </style>

  <!-- Background -->
  <rect width="1000" height="520" rx="16" fill="url(#dfBg)" stroke="#1E293B" stroke-width="2" />

  <!-- Header -->
  <text x="50" y="52" class="header-main">End-to-End <tspan fill="#38BDF8">Data Lifecycle &amp; Flow</tspan></text>
  <text x="50" y="80" class="header-sub">From raw video ingestion to vectorization, hybrid fusion, agent verification, and interactive player seeking</text>

  <!-- ROW 1: Stages 01 to 04 -->
  <!-- 01: Video Ingest -->
  <g transform="translate(50, 115)">
    <rect width="205" height="150" rx="12" fill="url(#dfCard)" stroke="#334155" stroke-width="1.8" />
    <text x="18" y="32" class="step-pill">01. INGESTION</text>
    <text x="18" y="62" class="card-title">Raw Video Ingest</text>
    <text x="18" y="90" class="card-desc">• YouTube URL / Upload</text>
    <text x="18" y="114" class="card-desc">• yt-dlp metadata</text>
    <text x="18" y="138" class="card-desc">• SQLite video record</text>
  </g>

  <!-- 02: Audio Demux -->
  <g transform="translate(280, 115)">
    <rect width="205" height="150" rx="12" fill="url(#dfCard)" stroke="#334155" stroke-width="1.8" />
    <text x="18" y="32" class="step-pill">02. EXTRACTION</text>
    <text x="18" y="62" class="card-title">16kHz Audio Stream</text>
    <text x="18" y="90" class="card-desc">• FFmpeg demuxing</text>
    <text x="18" y="114" class="card-desc">• 16-bit mono WAV</text>
    <text x="18" y="138" class="card-desc">• Acoustic speech feed</text>
  </g>

  <!-- 03: Whisper ASR -->
  <g transform="translate(510, 115)">
    <rect width="205" height="150" rx="12" fill="url(#dfCard)" stroke="#334155" stroke-width="1.8" />
    <text x="18" y="32" class="step-pill">03. ASR SPEECH</text>
    <text x="18" y="62" class="card-title">Whisper Transcripts</text>
    <text x="18" y="90" class="card-desc">• OpenAI Whisper ASR</text>
    <text x="18" y="114" class="card-desc">• Word-level timestamps</text>
    <text x="18" y="138" class="card-desc">• Clean textual stream</text>
  </g>

  <!-- 04: Overlap Chunking -->
  <g transform="translate(740, 115)">
    <rect width="210" height="150" rx="12" fill="url(#dfCard)" stroke="#334155" stroke-width="1.8" />
    <text x="18" y="32" class="step-pill">04. CHUNKING</text>
    <text x="18" y="62" class="card-title">Overlap Chunks</text>
    <text x="18" y="90" class="card-desc">• 120–180 words/chunk</text>
    <text x="18" y="114" class="card-desc">• 15–20% word overlap</text>
    <text x="18" y="138" class="card-desc">• Precise start/end times</text>
  </g>

  <!-- Arrows Row 1 -->
  <path d="M 255 190 L 275 190" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#dfArrow)" />
  <path d="M 485 190 L 505 190" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#dfArrow)" />
  <path d="M 715 190 L 735 190" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#dfArrow)" />

  <!-- Turn from Row 1 to Row 2 -->
  <path d="M 845 265 L 845 295 L 152 295 L 152 320" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4" />

  <!-- ROW 2: Stages 05 to 08 -->
  <!-- 05: Dense Vector + Lexical -->
  <g transform="translate(50, 325)">
    <rect width="205" height="150" rx="12" fill="url(#dfCard)" stroke="#334155" stroke-width="1.8" />
    <text x="18" y="32" class="step-pill">05. VECTORIZE</text>
    <text x="18" y="62" class="card-title">ChromaDB + BM25</text>
    <text x="18" y="90" class="card-desc">• 768-dim embeddings</text>
    <text x="18" y="114" class="card-desc">• nomic-embed-text</text>
    <text x="18" y="138" class="card-desc">• SQLite BM25 full-text</text>
  </g>

  <!-- 06: Hybrid RRF -->
  <g transform="translate(280, 325)">
    <rect width="205" height="150" rx="12" fill="url(#dfCard)" stroke="#334155" stroke-width="1.8" />
    <text x="18" y="32" class="step-pill">06. HYBRID RRF</text>
    <text x="18" y="62" class="card-title">Rank Fusion &amp; Exp</text>
    <text x="18" y="90" class="card-desc">• RRF k=60 unified rank</text>
    <text x="18" y="114" class="card-desc">• ±1 context window</text>
    <text x="18" y="138" class="card-desc">• Whole-video anchors</text>
  </g>

  <!-- 07: Multi-Agent QA -->
  <g transform="translate(510, 325)">
    <rect width="205" height="150" rx="12" fill="url(#dfCard)" stroke="#334155" stroke-width="1.8" />
    <text x="18" y="32" class="step-pill">07. AGENT LOOP</text>
    <text x="18" y="62" class="card-title">Agent Reasoning</text>
    <text x="18" y="90" class="card-desc">• Evidence verification</text>
    <text x="18" y="114" class="card-desc">• Groq / Gemini / Ollama</text>
    <text x="18" y="138" class="card-desc">• Prompt injection guard</text>
  </g>

  <!-- 08: Grounded Seek -->
  <g transform="translate(740, 325)">
    <rect width="210" height="150" rx="12" fill="url(#dfCard)" stroke="#38BDF8" stroke-width="2.2" />
    <text x="18" y="32" class="step-pill" fill="#34D399">08. PLAYER SEEK</text>
    <text x="18" y="62" class="card-title" fill="#38BDF8">Interactive Jump</text>
    <text x="18" y="90" class="card-desc">• Strict [MM:SS] citation</text>
    <text x="18" y="114" class="card-desc">• Clickable UI buttons</text>
    <text x="18" y="138" class="card-desc">• Instant video seeking</text>
  </g>

  <!-- Arrows Row 2 -->
  <path d="M 255 400 L 275 400" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#dfArrow)" />
  <path d="M 485 400 L 505 400" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#dfArrow)" />
  <path d="M 715 400 L 735 400" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#dfArrow)" />
</svg>
