<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <defs>
    <linearGradient id="vpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="vpCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
    <marker id="vpArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B" />
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .header-main { font-size: 26px; font-weight: 800; fill: #FFFFFF; }
    .header-sub { font-size: 15px; fill: #94A3B8; font-weight: 500; }
    .step-badge { font-size: 13px; font-weight: 800; letter-spacing: 1px; fill: #FBBF24; }
    .card-title { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
    .card-tech { font-size: 14px; font-weight: 600; fill: #A78BFA; }
    .card-desc { font-size: 13px; fill: #CBD5E1; }
  </style>

  <!-- Background -->
  <rect width="1000" height="480" rx="16" fill="url(#vpBg)" stroke="#1E293B" stroke-width="2" />

  <!-- Title -->
  <text x="50" y="52" class="header-main">Video → Viral Shorts <tspan fill="#F59E0B">Automated Pipeline</tspan></text>
  <text x="50" y="80" class="header-sub">From raw multi-hour video to 9:16 mobile vertical shorts with face-tracking and animated subtitles</text>

  <!-- ROW 1: Stages 01 to 04 -->
  <!-- 01: Ingestion -->
  <g transform="translate(50, 115)">
    <rect width="205" height="135" rx="12" fill="url(#vpCard)" stroke="#334155" stroke-width="1.8" />
    <text x="18" y="32" class="step-badge">STAGE 01</text>
    <text x="18" y="60" class="card-title">Video Ingestion</text>
    <text x="18" y="84" class="card-tech">yt-dlp Engine</text>
    <text x="18" y="110" class="card-desc">Validates stream &amp; formats</text>
  </g>

  <!-- 02: Audio Demux -->
  <g transform="translate(280, 115)">
    <rect width="205" height="135" rx="12" fill="url(#vpCard)" stroke="#334155" stroke-width="1.8" />
    <text x="18" y="32" class="step-badge">STAGE 02</text>
    <text x="18" y="60" class="card-title">Audio Demuxing</text>
    <text x="18" y="84" class="card-tech">FFmpeg Engine</text>
    <text x="18" y="110" class="card-desc">16kHz 16-bit mono WAV</text>
  </g>

  <!-- 03: Whisper ASR -->
  <g transform="translate(510, 115)">
    <rect width="205" height="135" rx="12" fill="url(#vpCard)" stroke="#334155" stroke-width="1.8" />
    <text x="18" y="32" class="step-badge">STAGE 03</text>
    <text x="18" y="60" class="card-title">Speech ASR</text>
    <text x="18" y="84" class="card-tech">OpenAI Whisper</text>
    <text x="18" y="110" class="card-desc">Word-level timestamps</text>
  </g>

  <!-- 04: Moment Detection -->
  <g transform="translate(740, 115)">
    <rect width="210" height="135" rx="12" fill="url(#vpCard)" stroke="#334155" stroke-width="1.8" />
    <text x="18" y="32" class="step-badge">STAGE 04</text>
    <text x="18" y="60" class="card-title">Hook Detection</text>
    <text x="18" y="84" class="card-tech">Audio Peak + Energy</text>
    <text x="18" y="110" class="card-desc">Isolates viral moments</text>
  </g>

  <!-- Arrows Row 1 -->
  <path d="M 255 182 L 275 182" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#vpArrow)" />
  <path d="M 485 182 L 505 182" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#vpArrow)" />
  <path d="M 715 182 L 735 182" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#vpArrow)" />

  <!-- Turn from Row 1 to Row 2 -->
  <path d="M 845 250 L 845 285 L 152 285 L 152 305" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" />

  <!-- ROW 2: Stages 05 to 07 -->
  <!-- 05: Face Tracking -->
  <g transform="translate(50, 310)">
    <rect width="275" height="135" rx="12" fill="url(#vpCard)" stroke="#334155" stroke-width="1.8" />
    <text x="20" y="32" class="step-badge">STAGE 05</text>
    <text x="20" y="60" class="card-title">Face Tracking</text>
    <text x="20" y="84" class="card-tech">OpenCV Haar Cascade</text>
    <text x="20" y="110" class="card-desc">Tracks speaker face position</text>
  </g>

  <!-- 06: Vertical Cropping -->
  <g transform="translate(355, 310)">
    <rect width="275" height="135" rx="12" fill="url(#vpCard)" stroke="#334155" stroke-width="1.8" />
    <text x="20" y="32" class="step-badge">STAGE 06</text>
    <text x="20" y="60" class="card-title">9:16 Vertical Reframing</text>
    <text x="20" y="84" class="card-tech">Dynamic Crop Filter</text>
    <text x="20" y="110" class="card-desc">Centers video around speaker</text>
  </g>

  <!-- 07: Subtitles & Export -->
  <g transform="translate(660, 310)">
    <rect width="290" height="135" rx="12" fill="url(#vpCard)" stroke="#F59E0B" stroke-width="2.2" />
    <text x="20" y="32" class="step-badge" fill="#FBBF24">STAGE 07: EXPORT</text>
    <text x="20" y="60" class="card-title" fill="#FBBF24">Burn Subtitles &amp; Export</text>
    <text x="20" y="84" class="card-tech">FFmpeg + ASS Subtitles</text>
    <text x="20" y="110" class="card-desc">Vertical MP4 ready for Shorts/TikTok</text>
  </g>

  <!-- Arrows Row 2 -->
  <path d="M 325 377 L 350 377" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#vpArrow)" />
  <path d="M 630 377 L 655 377" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#vpArrow)" />
</svg>
