<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <linearGradient id="agBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="agCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
    <marker id="agArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8B5CF6" />
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .header-main { font-size: 26px; font-weight: 800; fill: #FFFFFF; }
    .header-sub { font-size: 15px; fill: #94A3B8; font-weight: 500; }
    .agent-num { font-size: 13px; font-weight: 800; letter-spacing: 1px; fill: #C084FC; }
    .agent-title { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
    .agent-desc { font-size: 13.5px; fill: #CBD5E1; }
    .loop-banner { font-size: 14px; font-weight: 800; fill: #FBBF24; }
  </style>

  <!-- Background -->
  <rect width="1000" height="560" rx="16" fill="url(#agBg)" stroke="#1E293B" stroke-width="2" />

  <!-- Title -->
  <text x="50" y="52" class="header-main">Multi-Agent Video QA <tspan fill="#A855F7">ReAct Orchestration</tspan></text>
  <text x="50" y="80" class="header-sub">Bounded (≤ 3 iterations) collaborative multi-agent loop with evidence verification and safety boundaries</text>

  <!-- User Input Query Bar -->
  <g transform="translate(50, 105)">
    <rect width="900" height="50" rx="10" fill="#131B2E" stroke="#334155" stroke-width="1.8" />
    <circle cx="25" cy="25" r="6" fill="#38BDF8" />
    <text x="44" y="31" font-size="15" font-weight="600" fill="#FFFFFF">User Video Query: <tspan fill="#38BDF8" font-style="italic">"what video about" / "What did the speaker say about Alpha Centauri?"</tspan></text>
  </g>

  <!-- ROW 1: Agents 01, 02, 03 -->
  <!-- 01: Query Planner -->
  <g transform="translate(50, 180)">
    <rect width="280" height="145" rx="12" fill="url(#agCard)" stroke="#8B5CF6" stroke-width="2" />
    <text x="20" y="32" class="agent-num">AGENT 01</text>
    <text x="20" y="60" class="agent-title">QueryPlannerAgent</text>
    <text x="20" y="88" class="agent-desc">• Query normalization</text>
    <text x="20" y="110" class="agent-desc">• Intent: summary, lookup, time</text>
    <text x="20" y="132" class="agent-desc">• Sub-query &amp; timecode extraction</text>
  </g>

  <!-- 02: Retrieval Agent -->
  <g transform="translate(360, 180)">
    <rect width="280" height="145" rx="12" fill="url(#agCard)" stroke="#8B5CF6" stroke-width="2" />
    <text x="20" y="32" class="agent-num">AGENT 02</text>
    <text x="20" y="60" class="agent-title">RetrievalAgent</text>
    <text x="20" y="88" class="agent-desc">• Hybrid BM25 + dense search</text>
    <text x="20" y="110" class="agent-desc">• Reciprocal Rank Fusion (k=60)</text>
    <text x="20" y="132" class="agent-desc">• Whole-video timeline anchors</text>
  </g>

  <!-- 03: Timeline Agent -->
  <g transform="translate(670, 180)">
    <rect width="280" height="145" rx="12" fill="url(#agCard)" stroke="#8B5CF6" stroke-width="2" />
    <text x="20" y="32" class="agent-num">AGENT 03</text>
    <text x="20" y="60" class="agent-title">TimelineAgent</text>
    <text x="20" y="88" class="agent-desc">• Chronological order validation</text>
    <text x="20" y="110" class="agent-desc">• Forward scan for "after X" queries</text>
    <text x="20" y="132" class="agent-desc">• ±1 adjacent chunk expansion</text>
  </g>

  <!-- Arrows Row 1 -->
  <path d="M 330 252 L 355 252" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#agArrow)" />
  <path d="M 640 252 L 665 252" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#agArrow)" />

  <!-- Turn to Row 2 -->
  <path d="M 810 325 L 810 345 L 190 345 L 190 365" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4 4" />

  <!-- ROW 2: Agents 04, 05, 06 -->
  <!-- 04: Evidence Verification -->
  <g transform="translate(50, 370)">
    <rect width="280" height="145" rx="12" fill="url(#agCard)" stroke="#EC4899" stroke-width="2" />
    <text x="20" y="32" class="agent-num" fill="#F472B6">AGENT 04</text>
    <text x="20" y="60" class="agent-title">EvidenceVerification</text>
    <text x="20" y="88" class="agent-desc">• Keyword &amp; semantic overlap</text>
    <text x="20" y="110" class="agent-desc">• Confidence scoring (0.0 to 1.0)</text>
    <text x="20" y="132" class="agent-desc">• Rejects ungrounded claims</text>
  </g>

  <!-- 05: Answer Synthesis -->
  <g transform="translate(360, 370)">
    <rect width="280" height="145" rx="12" fill="url(#agCard)" stroke="#8B5CF6" stroke-width="2" />
    <text x="20" y="32" class="agent-num">AGENT 05</text>
    <text x="20" y="60" class="agent-title">AnswerSynthesisAgent</text>
    <text x="20" y="88" class="agent-desc">• Grounded answer synthesis</text>
    <text x="20" y="110" class="agent-desc">• Strict citations: [MM:SS]</text>
    <text x="20" y="132" class="agent-desc">• Multi-LLM provider routing</text>
  </g>

  <!-- 06: Safety Guardrail -->
  <g transform="translate(670, 370)">
    <rect width="280" height="145" rx="12" fill="url(#agCard)" stroke="#10B981" stroke-width="2" />
    <text x="20" y="32" class="agent-num" fill="#34D399">AGENT 06</text>
    <text x="20" y="60" class="agent-title">SafetyGuardrailAgent</text>
    <text x="20" y="88" class="agent-desc">• Prompt injection defense</text>
    <text x="20" y="110" class="agent-desc">• Hallucination boundaries</text>
    <text x="20" y="132" class="agent-desc">• Informative diagnostics pass</text>
  </g>

  <!-- Arrows Row 2 -->
  <path d="M 330 442 L 355 442" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#agArrow)" />
  <path d="M 640 442 L 665 442" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#agArrow)" />
</svg>
