<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .header-main { font-size: 26px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.5px; }
    .header-sub { font-size: 15px; fill: #94A3B8; font-weight: 500; }
    .layer-tag { font-size: 13px; font-weight: 800; letter-spacing: 1.8px; fill: #8B5CF6; }
    .card-title { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
    .card-body { font-size: 14px; fill: #CBD5E1; font-weight: 400; }
    .card-highlight { font-size: 14px; font-weight: 700; fill: #38BDF8; }
    .port-badge { font-size: 12px; font-weight: 800; fill: #38BDF8; }
  </style>

  <!-- Background Canvas -->
  <rect width="1000" height="680" rx="16" fill="url(#archBg)" stroke="#1E293B" stroke-width="2" />

  <!-- HEADER -->
  <text x="50" y="52" class="header-main">ClipForge AI V2 <tspan fill="#8B5CF6">System Architecture</tspan></text>
  <text x="50" y="80" class="header-sub">Multi-tier local-first video intelligence, repurposing pipeline, and agentic RAG platform</text>

  <!-- LAYER 1: CLIENTS -->
  <text x="50" y="120" class="layer-tag">1. PRESENTATION LAYER</text>
  
  <g transform="translate(50, 132)">
    <rect width="435" height="75" rx="12" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="1.8" />
    <text x="24" y="32" class="card-title">Streamlit Studio Dashboard</text>
    <text x="345" y="32" class="port-badge" fill="#EF4444">PORT 8501</text>
    <text x="24" y="56" class="card-body">Video Ingestion • Player Seeking • Viral Clips • AI Lab Studio</text>
  </g>

  <g transform="translate(515, 132)">
    <rect width="435" height="75" rx="12" fill="url(#cardGrad)" stroke="#06B6D4" stroke-width="1.8" />
    <text x="24" y="32" class="card-title">React 19 + Vite Web Application</text>
    <text x="345" y="32" class="port-badge" fill="#06B6D4">PORT 5173</text>
    <text x="24" y="56" class="card-body">Glassmorphic UI • Real-time Chat • Timeline Jump Badges</text>
  </g>

  <!-- LAYER 2: API ENGINE -->
  <text x="50" y="240" class="layer-tag">2. APPLICATION GATEWAY</text>
  <g transform="translate(50, 252)">
    <rect width="900" height="65" rx="12" fill="#131B2E" stroke="#2563EB" stroke-width="2" />
    <text x="24" y="28" class="card-title">FastAPI Backend Engine <tspan class="port-badge" fill="#3B82F6">(PORT 8000)</tspan></text>
    <text x="24" y="50" class="card-body">RESTful Endpoints • SSE Streaming • Channel Batch Ingestion • CORS &amp; Session Memory</text>
  </g>

  <!-- LAYER 3: 3 CORE ENGINES -->
  <text x="50" y="350" class="layer-tag">3. CORE PROCESSING ENGINES</text>

  <!-- Repurposing -->
  <g transform="translate(50, 362)">
    <rect width="285" height="150" rx="12" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.8" />
    <text x="20" y="32" class="card-title" fill="#FBBF24">Video Repurposing</text>
    <text x="20" y="60" class="card-body"><tspan class="card-highlight">yt-dlp:</tspan> Multi-video ingestion</text>
    <text x="20" y="84" class="card-body"><tspan class="card-highlight">Whisper:</tspan> Word-level timestamps</text>
    <text x="20" y="108" class="card-body"><tspan class="card-highlight">OpenCV:</tspan> Face detection tracking</text>
    <text x="20" y="132" class="card-body"><tspan class="card-highlight">FFmpeg:</tspan> 9:16 crop &amp; ASS subtitles</text>
  </g>

  <!-- Multi-Agent QA -->
  <g transform="translate(357, 362)">
    <rect width="285" height="150" rx="12" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-width="1.8" />
    <text x="20" y="32" class="card-title" fill="#C084FC">Multi-Agent Video QA</text>
    <text x="20" y="60" class="card-body"><tspan class="card-highlight">6-Agent ReAct:</tspan> Bounded (≤ 3 iter)</text>
    <text x="20" y="84" class="card-body"><tspan class="card-highlight">QueryPlanner:</tspan> Intent classification</text>
    <text x="20" y="108" class="card-body"><tspan class="card-highlight">TimelineAgent:</tspan> Anchor alignment</text>
    <text x="20" y="132" class="card-body"><tspan class="card-highlight">SafetyGuardrail:</tspan> Injection defense</text>
  </g>

  <!-- Hybrid RAG -->
  <g transform="translate(665, 362)">
    <rect width="285" height="150" rx="12" fill="url(#cardGrad)" stroke="#06B6D4" stroke-width="1.8" />
    <text x="20" y="32" class="card-title" fill="#38BDF8">Hybrid RAG Engine</text>
    <text x="20" y="60" class="card-body"><tspan class="card-highlight">Overlap Chunking:</tspan> 120-180 words</text>
    <text x="20" y="84" class="card-body"><tspan class="card-highlight">Dense Vector:</tspan> ChromaDB (768-dim)</text>
    <text x="20" y="108" class="card-body"><tspan class="card-highlight">Lexical BM25:</tspan> Inverted text index</text>
    <text x="20" y="132" class="card-body"><tspan class="card-highlight">RRF Fusion:</tspan> k=60 unified scoring</text>
  </g>

  <!-- LAYER 4: STORAGE & COMPUTE RUNTIMES -->
  <text x="50" y="545" class="layer-tag">4. PERSISTENCE &amp; LLM INFERENCE</text>

  <g transform="translate(50, 558)">
    <rect width="435" height="85" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.8" />
    <text x="24" y="30" class="card-title">Storage &amp; Vector Databases</text>
    <text x="24" y="54" class="card-body"><tspan class="card-highlight">SQLite (`clipforge.db`):</tspan> Videos, chunks, chat history</text>
    <text x="24" y="74" class="card-body"><tspan class="card-highlight">ChromaDB:</tspan> Project-isolated 768-dim vector collections</text>
  </g>

  <g transform="translate(515, 558)">
    <rect width="435" height="85" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.8" />
    <text x="24" y="30" class="card-title">Unified Multi-LLM Runtimes</text>
    <text x="24" y="54" class="card-body"><tspan class="card-highlight">Groq Cloud:</tspan> `gpt-oss-20b` (1500+ token buffer) • `qwen3.8-27b`</text>
    <text x="24" y="74" class="card-body"><tspan class="card-highlight">Gemini &amp; Ollama:</tspan> `gemini-2.5-flash` • Local `qwen2.5:3b`</text>
  </g>
</svg>
