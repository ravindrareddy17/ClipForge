<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="heroCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="violetGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .hero-eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 2.5px; fill: #A78BFA; }
    .hero-h1 { font-size: 44px; font-weight: 900; letter-spacing: -1px; }
    .hero-desc { font-size: 16px; fill: #94A3B8; line-height: 1.6; }
    .card-title { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .msg-user { font-size: 14px; font-weight: 600; fill: #E2E8F0; }
    .msg-bot { font-size: 13.5px; fill: #CBD5E1; line-height: 1.5; }
    .ts-pill { font-size: 12px; font-weight: 700; fill: #38BDF8; }
    .badge-txt { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="440" rx="18" fill="url(#heroBg)" stroke="#1E293B" stroke-width="2" />
  <rect width="1000" height="440" rx="18" fill="url(#violetGlow)" />
  <rect width="1000" height="440" rx="18" fill="url(#cyanGlow)" />

  <!-- LEFT HERO COLUMN: Typography & Value Proposition -->
  <g transform="translate(55, 65)">
    <text x="0" y="24" class="hero-eyebrow">NEXT-GENERATION VIDEO AI</text>
    <text x="0" y="75" class="hero-h1" fill="url(#textGrad)">ClipForge <tspan fill="#A855F7">AI V2</tspan></text>
    <text x="0" y="115" class="hero-desc">Transform multi-hour video into viral 9:16 shorts,</text>
    <text x="0" y="140" class="hero-desc">searchable transcript knowledge, and grounded</text>
    <text x="0" y="165" class="hero-desc">agentic QA with instant timestamp seeking.</text>

    <!-- Key Spec Badges -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="130" height="32" rx="16" fill="url(#pillGrad)" />
      <text x="65" y="20" text-anchor="middle" class="badge-txt">⚡ Local-First</text>

      <rect x="140" y="0" width="150" height="32" rx="16" fill="#131B2E" stroke="#38BDF8" stroke-width="1.2" />
      <text x="215" y="20" text-anchor="middle" class="badge-txt" fill="#38BDF8">🧠 Hybrid RAG</text>

      <rect x="300" y="0" width="140" height="32" rx="16" fill="#131B2E" stroke="#10B981" stroke-width="1.2" />
      <text x="370" y="20" text-anchor="middle" class="badge-txt" fill="#34D399">🤖 6-Agent Loop</text>
    </g>

    <!-- Metrics -->
    <g transform="translate(0, 275)">
      <text x="0" y="20" font-size="20" font-weight="800" fill="#FFFFFF">768-Dim</text>
      <text x="0" y="38" font-size="12" fill="#64748B">ChromaDB Vectors</text>

      <text x="140" y="20" font-size="20" font-weight="800" fill="#38BDF8">&lt; 1.5s</text>
      <text x="140" y="38" font-size="12" fill="#64748B">Groq Cloud Inference</text>

      <text x="300" y="20" font-size="20" font-weight="800" fill="#A855F7">≤ 3 Iter</text>
      <text x="300" y="38" font-size="12" fill="#64748B">Bounded ReAct Loop</text>
    </g>
  </g>

  <!-- RIGHT HERO COLUMN: Crystal-Clear High-Contrast UI Card -->
  <g transform="translate(520, 45)">
    <!-- Card Frame -->
    <rect width="430" height="350" rx="14" fill="url(#heroCardBg)" stroke="#8B5CF6" stroke-width="1.8" />
    
    <!-- Top Bar -->
    <rect width="430" height="42" rx="14" fill="#131B2E" />
    <circle cx="24" cy="21" r="5" fill="#EF4444" />
    <circle cx="40" cy="21" r="5" fill="#F59E0B" />
    <circle cx="56" cy="21" r="5" fill="#10B981" />
    <text x="80" y="26" font-size="12" font-weight="700" fill="#A78BFA">AI Video Chatbot • Grounded Q&amp;A</text>
    
    <!-- Cloud Status Pill -->
    <rect x="290" y="10" width="125" height="22" rx="11" fill="#065F46" />
    <circle cx="304" cy="21" r="3.5" fill="#34D399" />
    <text x="314" y="25" font-size="10" font-weight="800" fill="#A7F3D0">GROQ ONLINE</text>

    <!-- User Chat Bubble -->
    <g transform="translate(20, 60)">
      <rect width="390" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" class="msg-user">👤 what video about</text>
    </g>

    <!-- Bot Grounded Response Card -->
    <g transform="translate(20, 115)">
      <rect width="390" height="155" rx="8" fill="#0B132B" stroke="#2563EB" stroke-width="1.2" />
      <text x="14" y="24" font-size="12" font-weight="700" fill="#38BDF8">⚡ Verified Grounded Answer:</text>
      <text x="14" y="46" class="msg-bot">This video analyzes Japan's historic post-WWII</text>
      <text x="14" y="66" class="msg-bot">comeback into a global economic superpower.</text>
      <text x="14" y="92" class="msg-bot">• Reconstruction &amp; industrial rise <tspan font-weight="700" fill="#38BDF8">[07:49]</tspan></text>
      <text x="14" y="112" class="msg-bot">• High-tech manufacturing growth <tspan font-weight="700" fill="#38BDF8">[13:55]</tspan></text>
      <text x="14" y="132" class="msg-bot">• Banking &amp; national savings drive <tspan font-weight="700" fill="#38BDF8">[21:44]</tspan></text>
    </g>

    <!-- Interactive Jump Timestamp Buttons -->
    <g transform="translate(20, 285)">
      <text x="0" y="16" font-size="11" font-weight="700" fill="#94A3B8">JUMP TO TIMESTAMP:</text>
      
      <rect x="0" y="25" width="70" height="26" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
      <text x="35" y="42" text-anchor="middle" class="ts-pill">[07:49]</text>

      <rect x="80" y="25" width="70" height="26" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
      <text x="115" y="42" text-anchor="middle" class="ts-pill">[13:55]</text>

      <rect x="160" y="25" width="70" height="26" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
      <text x="195" y="42" text-anchor="middle" class="ts-pill">[21:44]</text>

      <rect x="240" y="25" width="70" height="26" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
      <text x="275" y="42" text-anchor="middle" class="ts-pill">[26:59]</text>

      <rect x="320" y="25" width="70" height="26" rx="6" fill="#7C3AED" />
      <text x="355" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Seek ▶</text>
    </g>
  </g>
</svg>
