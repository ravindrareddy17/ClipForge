<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="380" height="80">
  <defs>
    <linearGradient id="wmTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#EDE9FE" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }
    .brand-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3.2px;
      fill: #94A3B8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      fill: #DDD6FE;
    }
  </style>

  <!-- Wordmark Text -->
  <text x="4" y="46" class="brand-title" fill="url(#wmTextGrad)">Clip<tspan fill="#A78BFA">Forge</tspan></text>

  <!-- V2 PRO Pill Badge -->
  <rect x="238" y="22" width="72" height="24" rx="12" fill="url(#badgeGrad)" stroke="#8B5CF6" stroke-width="1.2" />
  <text x="274" y="38" text-anchor="middle" class="badge-text">V2 PRO</text>

  <!-- Subtitle Tagline -->
  <text x="6" y="68" class="brand-sub">VIDEO INTELLIGENCE PLATFORM</text>
</svg>
