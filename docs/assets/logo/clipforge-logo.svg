<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 110" width="500" height="110">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Inner Border Gradient -->
    <linearGradient id="logoBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="logoBoltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F5F3FF" />
      <stop offset="100%" stop-color="#DDD6FE" />
    </linearGradient>

    <!-- Wordmark Gradient -->
    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#EDE9FE" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="logoPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.2" />
    </linearGradient>

    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7C3AED" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .logo-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.6px;
    }
    .logo-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3.5px;
      fill: #94A3B8;
    }
    .logo-pill-txt {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      fill: #DDD6FE;
    }
  </style>

  <!-- Left: Rounded Icon -->
  <g transform="translate(10, 15)">
    <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#logoBgGrad)" filter="url(#logoShadow)" />
    <rect x="0" y="0" width="80" height="80" rx="22" fill="none" stroke="url(#logoBorderGrad)" stroke-width="1.8" />
    <!-- Bolt Symbol -->
    <path d="M43.5 19L23 46H39L36 71L58 40H42L46 19H43.5Z" 
          fill="url(#logoBoltGrad)" 
          stroke="#FFFFFF" 
          stroke-width="1.2" 
          stroke-linejoin="round" />
    <circle cx="45" cy="32" r="2.2" fill="#38BDF8" opacity="0.9" />
  </g>

  <!-- Right: Typography Lockup -->
  <g transform="translate(112, 0)">
    <!-- Wordmark -->
    <text x="0" y="62" class="logo-title" fill="url(#logoTextGrad)">Clip<tspan fill="#A78BFA">Forge</tspan></text>
    
    <!-- V2 PRO Pill Badge -->
    <rect x="236" y="36" width="76" height="24" rx="12" fill="url(#logoPillGrad)" stroke="#8B5CF6" stroke-width="1.2" />
    <text x="274" y="52" text-anchor="middle" class="logo-pill-txt">V2 PRO</text>

    <!-- Subtitle -->
    <text x="2" y="86" class="logo-sub">AI VIDEO STUDIO &amp; RAG INTELLIGENCE</text>
  </g>
</svg>
